services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tripper
      POSTGRES_USER: tripper
      POSTGRES_PASSWORD: tripper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripper -d tripper"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      TRIPPER_DATABASE_URL: postgresql+psycopg_async://tripper:tripper@postgres:5432/tripper
      TRIPPER_DATABASE_ECHO: "false"
      TRIPPER_GOOGLE_CLIENT_ID: ${TRIPPER_GOOGLE_CLIENT_ID:-replace-me.apps.googleusercontent.com}
      TRIPPER_INVITATION_TOKEN_KEY: ${TRIPPER_INVITATION_TOKEN_KEY:?set invitation token key}
      TRIPPER_INVITATION_BASE_URL: ${TRIPPER_INVITATION_BASE_URL:-http://localhost:8080/tripper/invitations}
      TRIPPER_MAILGUN_WEBHOOK_SIGNING_KEY: ${TRIPPER_MAILGUN_WEBHOOK_SIGNING_KEY:?set Mailgun webhook signing key}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn tripper_api.main:app --host 0.0.0.0 --port 8000"

  invitation-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      TRIPPER_DATABASE_URL: postgresql+psycopg_async://tripper:tripper@postgres:5432/tripper
      TRIPPER_INVITATION_TOKEN_KEY: ${TRIPPER_INVITATION_TOKEN_KEY:?set invitation token key}
      TRIPPER_INVITATION_BASE_URL: ${TRIPPER_INVITATION_BASE_URL:-http://localhost:8080/tripper/invitations}
      TRIPPER_MAILGUN_API_KEY: ${TRIPPER_MAILGUN_API_KEY:?set Mailgun API key}
      TRIPPER_MAILGUN_DOMAIN: ${TRIPPER_MAILGUN_DOMAIN:?set Mailgun domain}
      TRIPPER_INVITATION_FROM_EMAIL: ${TRIPPER_INVITATION_FROM_EMAIL:?set invitation sender}
      TRIPPER_MAILGUN_WEBHOOK_SIGNING_KEY: ${TRIPPER_MAILGUN_WEBHOOK_SIGNING_KEY:?set Mailgun webhook signing key}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m tripper_api.invitation.invitation_worker_main

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
