services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tripper_test
      POSTGRES_USER: tripper
      POSTGRES_PASSWORD: tripper
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripper -d tripper_test"]
      interval: 1s
      timeout: 5s
      retries: 30
